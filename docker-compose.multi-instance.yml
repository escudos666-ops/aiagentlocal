# Production multi-instance configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.multi-instance.yml up -d

services:
  # Disable the single-instance Open WebUI service from the base compose file
  # when this overlay is used. Nginx owns port 3000 in multi-instance mode.
  openwebui:
    profiles:
      - single-instance

  openwebui-1:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - agentnet
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_BASE=http://ollama:11434
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-agentdb}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_API_HOST=chroma
      - CHROMA_API_PORT=8000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=webui
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-admin123}
      - ENABLE_OLLAMA_API=true
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - TIKA_SERVER_ENDPOINT=http://tika:9998
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      tika:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G

  openwebui-2:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - agentnet
    ports:
      - "127.0.0.1:3002:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_BASE=http://ollama:11434
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-agentdb}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_API_HOST=chroma
      - CHROMA_API_PORT=8000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=webui
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-admin123}
      - ENABLE_OLLAMA_API=true
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - TIKA_SERVER_ENDPOINT=http://tika:9998
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      tika:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G

  # Load balancer for multi-instance Open WebUI
  nginx:
    image: nginx:alpine
    container_name: webui-lb
    restart: unless-stopped
    networks:
      - agentnet
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openwebui-1
      - openwebui-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
