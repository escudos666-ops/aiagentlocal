
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - agentnet
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MCP_INITIALIZE_TIMEOUT=20
      - 'TOOL_SERVER_CONNECTIONS=[{"url":"http://agentics-mcp:8766/mcp","path":"","type":"mcp","auth_type":"none","headers":{},"key":"","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"id":"agentics_mcp","name":"Agentics MCP","description":"Local Agentics MCP tools for service health checks and Agentics automations."}}]'
    depends_on:
      - ollama
      - agentics-mcp
    networks:
      - agentnet
    restart: unless-stopped

  agentics-mcp:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentics-mcp
    command: ["python", "/app/mcp/agentics_mcp_server.py"]
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./mcp/agentics_mcp_server.py:/app/mcp/agentics_mcp_server.py:ro
    environment:
      - MCP_NAME=Agentics MCP
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8766
      - MCP_PATH=/mcp
      - N8N_CHAT_URL=http://n8n:5678/webhook/agentics-chat
      - N8N_WHATSAPP_URL=http://n8n:5678/webhook/agentics-whatsapp-send
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - agentnet
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-project_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-secret_password}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - agentnet
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-project_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agentnet
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secret_password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - agentnet
    restart: unless-stopped

networks:
  agentnet:
    driver: bridge

volumes:
  ollama_data:
  open-webui_data:
  n8n_data:
  postgres_data:
  redis_data:
  minio_data:
