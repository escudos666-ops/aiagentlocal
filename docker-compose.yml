name: agentics

services:
  personal-assistant-webui:
    image: agentics-personal-assistant-webui
    build:
      context: ./personal-assistant-site
      dockerfile: ./Dockerfile
    container_name: agentics-personal-assistant-webui
    environment:
      NODE_ENV: production
      PORT: 8787
      OPEN_WEBUI_INTERNAL_URL: http://open-webui:8080
      OLLAMA_INTERNAL_URL: http://ollama:11434
      AGENTICS_MCP_INTERNAL_URL: http://agentics-mcp:8766
      AGENTICS_TOOLS_API_INTERNAL_URL: http://agentics-tools-api:8765
      N8N_INTERNAL_URL: http://n8n:5678
      MINIO_INTERNAL_URL: http://minio:9000
      GRAFANA_INTERNAL_URL: ${GRAFANA_INTERNAL_URL:-}
      PROMETHEUS_INTERNAL_URL: ${PROMETHEUS_INTERNAL_URL:-}
      LOKI_INTERNAL_URL: ${LOKI_INTERNAL_URL:-}
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      open-webui:
        condition: service_healthy
      ollama:
        condition: service_healthy
      agentics-mcp:
        condition: service_started
      agentics-tools-api:
        condition: service_started
      n8n:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          (command -v curl >/dev/null && curl -fsS http://127.0.0.1:8787/ >/dev/null) ||
          (command -v wget >/dev/null && wget -q --spider http://127.0.0.1:8787/) ||
          (command -v node >/dev/null && node -e "const http=require('http');const req=http.get('http://127.0.0.1:8787/',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});")
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agentnet
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - agentnet
    restart: unless-stopped

  pytorch-service:
    build:
      context: ./pytorch-service
      dockerfile: Dockerfile
    container_name: pytorch-service
    gpus: all
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_NVML_BASED_CUDA_CHECK: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - agentnet
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      WEBUI_NAME: Agentics Personal Assistant
      WEBUI_URL: ${WEBUI_URL:-http://127.0.0.1:3000}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-this-webui-secret-key}
      WEBUI_ADMIN_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:-admin@local}
      WEBUI_ADMIN_PASSWORD: ${OPENWEBUI_ADMIN_PASSWORD:-change-this-openwebui-password}
      WEBUI_ADMIN_NAME: ${OPENWEBUI_ADMIN_NAME:-Admin}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://127.0.0.1:3000;http://localhost:3000;http://127.0.0.1:8787;http://localhost:8787;http://127.0.0.1:8088;http://localhost:8088;http://ai.localhost;http://n8n.localhost;http://graphql.localhost;https://mjhee-personal-assistant.admetec-nl-8738.chatgpt-team.site}
      ENABLE_SIGNUP: "false"
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://host.docker.internal:12434/engines/llama.cpp/v1}
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-http://host.docker.internal:12434/engines/llama.cpp/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dmr-local}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-dmr-local}
      MCP_INITIALIZE_TIMEOUT: ${MCP_INITIALIZE_TIMEOUT:-20}
      TASK_MODEL: ${TASK_MODEL:-agentics-assistant:latest}
      TASK_MODEL_EXTERNAL: ${TASK_MODEL_EXTERNAL:-docker.io/ai/llama3.2:latest}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-agentics-assistant:latest}
      DEFAULT_PINNED_MODELS: ${DEFAULT_PINNED_MODELS:-agentics-assistant:latest,llama3.1:latest,qwen2.5-coder:7b,llama3.2:3b,docker.io/ai/llama3.2:latest}
      DEFAULT_MODEL_PARAMS: '{"stream_response":false}'
      ENABLE_BASE_MODELS_CACHE: "true"
      OPEN_TERMINAL_URL: http://open-terminal:8000
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:-agentics-terminal-key}
      REDIS_URL: redis://redis:6379/0
      WEBSOCKET_REDIS_URL: redis://redis:6379/1
      VECTOR_DB: chroma
      CHROMA_HTTP_HOST: chroma
      CHROMA_HTTP_PORT: "8000"
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998
      RAG_EMBEDDING_ENGINE: ollama
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text:latest}
      TOOL_SERVER_CONNECTIONS: >-
        [{"url":"http://agentics-mcp:8766/mcp","path":"","type":"mcp","auth_type":"none","headers":{},"key":"","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"id":"agentics_mcp","name":"Agentics MCP","description":"Local Agentics MCP tools for service health checks and Agentics automations."}}]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      agentics-mcp:
        condition: service_started
      tika:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request, json
          r = urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)
          sys.exit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - agentnet
    restart: unless-stopped

  agentics-mcp:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentics-mcp
    command: ["python", "/app/mcp/agentics_mcp_server.py"]
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./mcp/agentics_mcp_server.py:/app/mcp/agentics_mcp_server.py:ro
    environment:
      MCP_NAME: Agentics MCP
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8766"
      MCP_PATH: /mcp
      N8N_CHAT_URL: http://n8n:5678/webhook/agentics-chat
      N8N_WHATSAPP_URL: http://n8n:5678/webhook/agentics-whatsapp-send
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agentnet
    restart: unless-stopped

  agentics-tools-api:
    build:
      context: ./agentics-tools-api
      dockerfile: Dockerfile
    container_name: agentics-tools-api
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AGENTICS_DEFAULT_AGENT_MODEL: ${AGENTICS_DEFAULT_AGENT_MODEL:-agentics-assistant:latest}
      AGENTICS_TOOLS_CORS_ORIGINS: ${AGENTICS_TOOLS_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8787,http://localhost:8787,http://127.0.0.1:8088,http://localhost:8088,https://mjhee-personal-assistant.admetec-nl-8738.chatgpt-team.site}
      OPEN_TERMINAL_URL: http://open-terminal:8000
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:-agentics-terminal-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          for path in ('/health', '/docs', '/openapi.json', '/'):
              try:
                  r = urllib.request.urlopen('http://127.0.0.1:8765' + path, timeout=5)
                  if 200 <= r.status < 500:
                      sys.exit(0)
              except Exception:
                  pass
          sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agentnet
    restart: unless-stopped

  agentics-gateway:
    image: nginx:alpine
    container_name: agentics-gateway
    ports:
      - "127.0.0.1:80:8088"
      - "127.0.0.1:8088:8088"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      personal-assistant-webui:
        condition: service_started
      open-webui:
        condition: service_started
      ollama:
        condition: service_started
      agentics-mcp:
        condition: service_started
      agentics-tools-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - agentnet
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - open_terminal_data:/home/user
      - ./python-workspace:/home/user/workspace
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:-agentics-terminal-key}
      OPEN_TERMINAL_MAX_SESSIONS: "8"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          (command -v curl >/dev/null && curl -fsS http://127.0.0.1:8000/health >/dev/null) ||
          (command -v wget >/dev/null && wget -q -O- http://127.0.0.1:8000/health >/dev/null) ||
          (command -v python3 >/dev/null && python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)")
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - agentnet
    restart: unless-stopped

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    container_name: agentics-playwright
    command:
      - npx
      - -y
      - playwright@1.58.0
      - run-server
      - --host
      - 0.0.0.0
      - --port
      - "3010"
    ports:
      - "127.0.0.1:3010:3010"
    shm_size: "2gb"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const net=require('net'); const s=net.connect(3010,'127.0.0.1',()=>process.exit(0)); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),5000);"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - agentnet
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-project_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://127.0.0.1:5678/}
      N8N_METRICS: "true"
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http=require('http');
          const req=http.get('http://127.0.0.1:5678/healthz', res=>process.exit(res.statusCode === 200 ? 0 : 1));
          req.on('error',()=>process.exit(1));
          req.setTimeout(5000,()=>{req.destroy();process.exit(1);});
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - agentnet
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-project_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agentnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agentnet
    restart: unless-stopped

  postgraphile:
    image: graphile/postgraphile:latest
    container_name: postgraphile
    command:
      - --connection
      - postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-project_db}
      - --schema
      - public
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --watch
      - --enhance-graphiql
      - --dynamic-json
      - --cors
      - --retry-on-init-fail
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          (command -v curl >/dev/null && curl -fsS http://127.0.0.1:5000/graphiql >/dev/null) ||
          (command -v wget >/dev/null && wget -q --spider http://127.0.0.1:5000/graphiql) ||
          (command -v node >/dev/null && node -e "const http=require('http');const req=http.get('http://127.0.0.1:5000/graphiql',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});")
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - agentnet
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - agentnet
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8000;
          printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          timeout 5 cat <&3 | grep -q "200 OK"'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - agentnet
    restart: unless-stopped

  tika:
    image: apache/tika:latest
    container_name: tika
    ports:
      - "127.0.0.1:9998:9998"
    networks:
      - agentnet
    restart: unless-stopped

  warp-sandbox:
    build:
      context: ./warp-sandbox
      dockerfile: Dockerfile
    container_name: warp-sandbox
    profiles: ["sandbox"]
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WARP_CACHE_PATH: /root/.cache/warp
    volumes:
      - ./warp-sandbox:/workspace:ro
      - warp_cache:/root/.cache/warp
    networks:
      - agentnet
    restart: "no"

networks:
  agentnet:
    driver: bridge

volumes:
  ollama_data:
  open-webui_data:
  n8n_data:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:
  open_terminal_data:
  warp_cache:
