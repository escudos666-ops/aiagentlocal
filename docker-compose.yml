
services:
  personal-assistant-webui:
    image: agentics-personal-assistant-webui
    build:
      context: personal-assistant-site
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      OPEN_WEBUI_INTERNAL_URL: http://open-webui:8080
      OLLAMA_INTERNAL_URL: http://ollama:11434
      AGENTICS_MCP_INTERNAL_URL: http://agentics-mcp:8766
      N8N_INTERNAL_URL: http://n8n:5678
      MINIO_INTERNAL_URL: http://minio:9000
      GRAFANA_INTERNAL_URL: http://grafana:3000
      PROMETHEUS_INTERNAL_URL: http://prometheus:9090
      LOKI_INTERNAL_URL: http://loki:3100
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - agentnet
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    networks:
      - agentnet
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - WEBUI_NAME=Agentics Personal Assistant
      - WEBUI_URL=http://127.0.0.1:3000
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - WEBUI_ADMIN_EMAIL=${OPENWEBUI_ADMIN_EMAIL:-admin@local}
      - WEBUI_ADMIN_PASSWORD=${OPENWEBUI_ADMIN_PASSWORD:-change-this-openwebui-password}
      - WEBUI_ADMIN_NAME=${OPENWEBUI_ADMIN_NAME:-Admin}
      - CORS_ALLOW_ORIGIN=http://127.0.0.1:3000;http://localhost:3000
      - ENABLE_SIGNUP=false
      - ENABLE_OLLAMA_API=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://host.docker.internal:12434/engines/llama.cpp/v1
      - OPENAI_API_BASE_URLS=http://host.docker.internal:12434/engines/llama.cpp/v1
      - OPENAI_API_KEY=dmr-local
      - OPENAI_API_KEYS=dmr-local
      - MCP_INITIALIZE_TIMEOUT=20
      - TASK_MODEL=${TASK_MODEL:-agentics-assistant:latest}
      - TASK_MODEL_EXTERNAL=${TASK_MODEL_EXTERNAL:-docker.io/ai/llama3.2:latest}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-agentics-assistant:latest}
      - DEFAULT_PINNED_MODELS=${DEFAULT_PINNED_MODELS:-agentics-assistant:latest,llama3.1:latest,qwen2.5-coder:7b,llama3.2:3b,docker.io/ai/llama3.2:latest}
      - 'DEFAULT_MODEL_PARAMS={"function_calling":"native","stream_response":false}'
      - ENABLE_BASE_MODELS_CACHE=true
      - REDIS_URL=redis://redis:6379/0
      - WEBSOCKET_REDIS_URL=redis://redis:6379/1
      - VECTOR_DB=chroma
      - CHROMA_HTTP_HOST=chroma
      - CHROMA_HTTP_PORT=8000
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_MODEL=nomic-embed-text:latest
      - 'TOOL_SERVER_CONNECTIONS=[{"url":"http://agentics-mcp:8766/mcp","path":"","type":"mcp","auth_type":"none","headers":{},"key":"","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"id":"agentics_mcp","name":"Agentics MCP","description":"Local Agentics MCP tools for service health checks and Agentics automations."}}]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - agentics-mcp
      - redis
      - chroma
      - tika
    networks:
      - agentnet
    restart: unless-stopped

  agentics-mcp:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentics-mcp
    command: ["python", "/app/mcp/agentics_mcp_server.py"]
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./mcp/agentics_mcp_server.py:/app/mcp/agentics_mcp_server.py:ro
    environment:
      - MCP_NAME=Agentics MCP
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8766
      - MCP_PATH=/mcp
      - N8N_CHAT_URL=http://n8n:5678/webhook/agentics-chat
      - N8N_WHATSAPP_URL=http://n8n:5678/webhook/agentics-whatsapp-send
      - WAHA_API_KEY=${WAHA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - agentnet
    restart: unless-stopped

  agentics-tools-api:
    build:
      context: ./agentics-tools-api
      dockerfile: Dockerfile
    container_name: agentics-tools-api
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - AGENTICS_DEFAULT_AGENT_MODEL=${AGENTICS_DEFAULT_AGENT_MODEL:-agentics-assistant:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - open-webui
      - agentics-mcp
    networks:
      - agentnet
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - open_terminal_data:/home/user
      - ./python-workspace:/home/user/workspace
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-agentics-terminal-key}
      - OPEN_TERMINAL_MAX_SESSIONS=8
    networks:
      - agentnet
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-project_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-secret_password}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - agentnet
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-project_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - agentnet
    restart: unless-stopped

  postgraphile:
    image: graphile/postgraphile:latest
    container_name: postgraphile
    command:
      - --connection
      - postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-project_db}
      - --schema
      - public
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --watch
      - --enhance-graphiql
      - --dynamic-json
      - --cors
      - --retry-on-init-fail
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres
    networks:
      - agentnet
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secret_password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - agentnet
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - agentnet
    restart: unless-stopped

  tika:
    image: apache/tika:latest
    container_name: tika
    ports:
      - "127.0.0.1:9998:9998"
    networks:
      - agentnet
    restart: unless-stopped

networks:
  agentnet:
    driver: bridge

volumes:
  ollama_data:
  open-webui_data:
  n8n_data:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:
  open_terminal_data:
