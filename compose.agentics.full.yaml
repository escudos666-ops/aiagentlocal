name: agentics

services:
  gateway:
    image: nginx:alpine
    container_name: agentics-gateway
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8088:8088"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentics_agentnet
      - agentics_default
      - dmr_default
    restart: unless-stopped

  agentics-open-webui-dmr:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentics-open-webui-dmr
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:12434
      - WEBUI_AUTH=false
      - DEFAULT_MODELS=docker.io/ai/qwen2.5:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-dmr:/app/backend/data
    networks:
      - agentics_agentnet
      - agentics_default
      - dmr_default
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n.localhost/
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - agentics_agentnet
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - WHATSAPP_API_PORT=3000
      - WHATSAPP_RESTART_ALL_SESSIONS=True
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_API_KEY=${WAHA_API_KEY:-change-this-waha-api-key}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-change-this-waha-dashboard-password}
    volumes:
      - waha-data:/app/.sessions
    networks:
      - agentics_agentnet
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agentics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agentics}
      - POSTGRES_DB=${POSTGRES_DB:-agentics}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentics_agentnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agentics_agentnet
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - agentics_agentnet
    restart: unless-stopped

  tika:
    image: apache/tika:latest
    container_name: tika
    ports:
      - "127.0.0.1:9998:9998"
    networks:
      - agentics_agentnet
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - agentics_agentnet
    restart: unless-stopped

  postgraphile:
    image: graphile/postgraphile:latest
    container_name: postgraphile
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      --connection postgres://${POSTGRES_USER:-agentics}:${POSTGRES_PASSWORD:-agentics}@postgres:5432/${POSTGRES_DB:-agentics}
      --host 0.0.0.0
      --port 5000
      --schema public
      --enhance-graphiql
      --cors
    depends_on:
      - postgres
    networks:
      - agentics_agentnet
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - agentics_agentnet
      - agentics_default
    restart: unless-stopped

  n8n-imports:
    image: nginx:alpine
    container_name: n8n-imports
    ports:
      - "127.0.0.1:8898:80"
    volumes:
      - ./n8n-imports:/usr/share/nginx/html:ro
    networks:
      - agentics_agentnet
    restart: unless-stopped

  workflow-server:
    image: nginx:alpine
    container_name: workflow-server
    ports:
      - "127.0.0.1:8899:80"
    networks:
      - agentics_agentnet
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agentics_agentnet
    restart: unless-stopped

  python:
    image: python:3.12-slim
    container_name: python
    command: sleep infinity
    networks:
      - agentics_agentnet
    restart: unless-stopped

  agentics-node18:
    image: node:18-alpine
    container_name: agentics-node18
    command: sleep infinity
    networks:
      - agentics_agentnet
    restart: unless-stopped

  agentics-node24:
    image: node:24-slim
    container_name: agentics-node24
    command: sleep infinity
    networks:
      - agentics_agentnet
    restart: unless-stopped

  langchain:
    image: langchain/langchain:latest
    container_name: langchain
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - dev

  agentics-dashboard:
    image: agentics-dashboard:latest
    container_name: agentics-dashboard
    expose:
      - "8080"
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - custom

  agentics-pa-service:
    image: agentics-pa-service:latest
    container_name: agentics-pa-service
    expose:
      - "8000"
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - custom

  agentics-hugginhgface:
    image: agentics-huggingface:latest
    container_name: agentics-hugginhgface
    expose:
      - "8082"
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - custom

  agentics-pytorch-service:
    image: agentics-pytorch-service:latest
    container_name: agentics-pytorch-service
    expose:
      - "8888"
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - custom

  agentics-webui_preview:
    image: agentics-webui_preview:latest
    container_name: agentics-webui_preview
    expose:
      - "80"
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - custom

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - legacy

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - openwebui-legacy:/app/backend/data
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - legacy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - agentics_agentnet
    restart: unless-stopped
    profiles:
      - monitor

networks:
  agentics_agentnet:
    name: agentics_agentnet
    external: true
  agentics_default:
    name: agentics_default
    external: true
  dmr_default:
    name: dmr_default
    external: true

volumes:
  open-webui-dmr:
  n8n-data:
  waha-data:
  postgres-data:
  redis-data:
  chroma-data:
  minio-data:
  ollama-data:
  openwebui-legacy:
  grafana-data:
