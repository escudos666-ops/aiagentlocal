events {}

http {
    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream personal_assistant_webui { server personal-assistant-webui:8787; }
    upstream open_webui { server open-webui:8080; }
    upstream ollama_api { server ollama:11434; }
    upstream agentics_mcp { server agentics-mcp:8766; }
    upstream tools_api { server agentics-tools-api:8765; }
    upstream n8n_api { server n8n:5678; }
    upstream minio_api { server minio:9000; }
    upstream chroma_api { server chroma:8000; }
    upstream tika_api { server tika:9998; }
    upstream postgraphile_api { server postgraphile:5000; }
    upstream open_terminal_api { server open-terminal:8000; }

    server {
        listen 8088;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location = /health {
            add_header Content-Type application/json;
            return 200 '{"status":true,"service":"agentics-gateway"}';
        }

        location / {
            proxy_pass http://personal_assistant_webui;
        }

        location /api/open-webui/ {
            proxy_pass http://open_webui/;
        }

        location /api/ollama/ {
            proxy_pass http://ollama_api/;
        }

        location = /mcp {
            proxy_pass http://agentics_mcp/mcp;
        }

        location /mcp/ {
            proxy_pass http://agentics_mcp/mcp/;
        }

        location /api/tools/ {
            proxy_pass http://tools_api/;
        }

        location /api/n8n/ {
            proxy_pass http://n8n_api/;
        }

        location /api/minio/ {
            proxy_pass http://minio_api/;
        }

        location /api/chroma/ {
            proxy_pass http://chroma_api/;
        }

        location /api/tika/ {
            proxy_pass http://tika_api/;
        }

        location /api/postgraphile/ {
            proxy_pass http://postgraphile_api/;
        }

        location /api/terminal/ {
            proxy_pass http://open_terminal_api/;
        }
    }

    server {
        listen 8088;
        server_name ai.localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://open_webui;
        }
    }

    server {
        listen 8088;
        server_name n8n.localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://n8n_api;
        }
    }

    server {
        listen 8088;
        server_name graphql.localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location = /graphql {
            if ($request_method = HEAD) {
                return 200;
            }
            proxy_pass http://postgraphile_api/graphql;
        }

        location / {
            proxy_pass http://postgraphile_api;
        }
    }
}
