global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openwebui-enterprise'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'kong'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kong:8001']

  - job_name: 'openwebui'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['openwebui:8080']

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'chroma'
    static_configs:
      - targets: ['chroma:8000']

  - job_name: 'temporal'
    static_configs:
      - targets: ['temporal:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'
